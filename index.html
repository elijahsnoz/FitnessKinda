<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101918" media="(prefers-color-scheme: dark)">
<meta name="description" content="FitnessKinda — know your body, keep your history. A private personal health timeline that helps you record, understand and communicate what has been happening to your body over time.">
<title>FitnessKinda</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-tile.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <svg class="topbar-mark" viewBox="0 0 100 104" fill="none" aria-hidden="true">
        <circle class="balloon" cx="49" cy="10" r="7" stroke-width="6"></circle>
        <path class="body" d="M10 37C22 26 32 30 41.5 28.5" stroke-width="5" stroke-linecap="round"></path>
        <path class="body" d="M88 15C79 26 68 29 57 28.5" stroke-width="5" stroke-linecap="round"></path>
        <path class="body" d="M49 25c-9 6 9 9 0 15-9 6 9 9 0 14" stroke-width="5" stroke-linecap="round"></path>
        <path class="body" d="M49 54C43.5 46.5 31 45 25 52.5 19 60 23.5 72 36 83 41.5 87.5 45.5 90 47.5 93" stroke-width="5" stroke-linecap="round"></path>
        <path class="body" d="M49 54C54.5 46 67 44 73.5 52 80 60 75 72.5 62 83.5 56.5 88 52.5 90.5 51 93.5" stroke-width="5" stroke-linecap="round"></path>
      </svg>
    <h1 class="brand">Fitness<span>Kinda</span></h1>
  </div>
</header>

<main id="main">
  <section id="view-home" class="screen view" aria-labelledby="home-title"></section>
  <section id="view-timeline" class="screen view" aria-labelledby="timeline-title" hidden></section>
  <section id="view-move" class="screen view" aria-labelledby="move-title" hidden></section>
  <section id="view-health" class="screen view" aria-labelledby="health-title" hidden></section>
  <section id="view-profile" class="screen view" aria-labelledby="profile-title" hidden></section>
  <section id="view-record" class="screen view" aria-labelledby="record-title" hidden></section>
  <section id="view-summary" class="screen view" aria-labelledby="summary-title" hidden></section>
</main>

<nav class="tabbar" aria-label="Sections">
  <button class="tab is-active" data-view="home" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg><span>Home</span>
  </button>
  <button class="tab" data-view="timeline">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16"/><circle cx="7" cy="9" r="2"/><circle cx="7" cy="16.5" r="2"/><path d="M12 9h8M12 16.5h6"/></svg><span>Timeline</span>
  </button>
  <button class="tab" data-view="move">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17c3-1 4.5-4 6-7s3-5 4-5"/><circle cx="17" cy="6" r="2"/><path d="M13 20l3-5 4 2"/></svg><span>Move</span>
  </button>
  <button class="tab" data-view="health">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20C7 16.5 4 13 4 9.8 4 7.1 6 5 8.6 5c1.5 0 2.7.7 3.4 1.8C12.7 5.7 13.9 5 15.4 5 18 5 20 7.1 20 9.8c0 3.2-3 6.7-8 10.2z"/></svg><span>Health</span>
  </button>
  <button class="tab" data-view="profile">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg><span>Profile</span>
  </button>
</nav>

<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
