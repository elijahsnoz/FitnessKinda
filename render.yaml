# fitnesskinda.fit on Render — one web service, one persistent disk.
#
# The disk is not optional. Render's filesystem is ephemeral without it, and the
# SQLite database would be wiped on every deploy, restart and spin-down. A disk
# requires a paid instance type.
#
# ADMIN_EMAILS is deliberately not in this file: the repo is public. It is set in
# the Render dashboard (sync: false keeps Render from expecting it here).

services:
  - type: web
    name: fitnesskinda
    runtime: node
    plan: starter            # free has no disk; do not downgrade this
    region: frankfurt        # closest well-peered Render region to West Africa
    branch: main
    autoDeploy: true

    buildCommand: npm install --omit=dev    # no dependencies; this is a no-op
    startCommand: node server/start.js
    healthCheckPath: /api/health

    disk:
      name: fk-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "22.21.1"        # node:sqlite needs 22.5+
      - key: NODE_ENV
        value: production       # marks the session cookie Secure
      - key: DATA_DIR
        value: /var/data        # must match the disk mountPath
      - key: ALLOWED_ORIGINS
        value: https://fitnesskinda.fit
      - key: ACCESS_LOG
        value: "1"              # method, route pattern and status only
      - key: ADMIN_EMAILS
        sync: false             # set this in the dashboard
