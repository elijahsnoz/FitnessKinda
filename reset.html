<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101918" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Choose a new password</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body class="doc">

<header class="topbar">
  <div class="topbar-inner">
    <svg class="topbar-mark" viewBox="0 0 100 104" fill="none" aria-hidden="true">
        <circle class="balloon" cx="49" cy="10" r="7" stroke-width="6"></circle>
        <path class="body" d="M10 37C22 26 32 30 41.5 28.5" stroke-width="5" stroke-linecap="round"></path>
        <path class="body" d="M88 15C79 26 68 29 57 28.5" stroke-width="5" stroke-linecap="round"></path>
        <path class="body" d="M49 25c-9 6 9 9 0 15-9 6 9 9 0 14" stroke-width="5" stroke-linecap="round"></path>
        <path class="body" d="M49 54C43.5 46.5 31 45 25 52.5 19 60 23.5 72 36 83 41.5 87.5 45.5 90 47.5 93" stroke-width="5" stroke-linecap="round"></path>
        <path class="body" d="M49 54C54.5 46 67 44 73.5 52 80 60 75 72.5 62 83.5 56.5 88 52.5 90.5 51 93.5" stroke-width="5" stroke-linecap="round"></path>
      </svg>
    <h1 class="brand">Fitness<span>Kinda</span></h1>
  </div>
</header>

<main id="main">
  <div id="reset-body">
    <h1 class="title">Choose a new password</h1>
    <p class="lede">Setting one signs you in and ends every other session on your account.</p>

    <form id="reset-form" novalidate>
      <div class="field">
        <label for="reset-password">New password</label>
        <div class="password-field">
          <input type="password" id="reset-password" autocomplete="new-password">
          <button type="button" class="reveal" data-reveal="reset-password"
            aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="eye-open"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="eye-shut"><path d="M4 4l16 16"></path><path d="M9.5 6C10.3 5.7 11.1 5.5 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3.3 4"></path><path d="M6.3 8A17 17 0 0 0 2.5 12S6 18.5 12 18.5c1.5 0 2.8-.4 4-1"></path><path d="M10 10a3 3 0 0 0 4 4"></path></svg>
          </button>
        </div>
        <p class="hint">At least 8 characters.</p>
      </div>

      <div class="field">
        <label for="reset-confirm">Type it again</label>
        <div class="password-field">
          <input type="password" id="reset-confirm" autocomplete="new-password">
          <button type="button" class="reveal" data-reveal="reset-confirm"
            aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="eye-open"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="eye-shut"><path d="M4 4l16 16"></path><path d="M9.5 6C10.3 5.7 11.1 5.5 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3.3 4"></path><path d="M6.3 8A17 17 0 0 0 2.5 12S6 18.5 12 18.5c1.5 0 2.8-.4 4-1"></path><path d="M10 10a3 3 0 0 0 4 4"></path></svg>
          </button>
        </div>
        <p class="hint" id="reset-hint">Your records are not touched by this.</p>
      </div>

      <p id="reset-error" class="error" role="alert" hidden></p>
      <div class="actions">
        <button type="submit" class="btn primary" id="reset-submit">Set my new password</button>
      </div>
    </form>
  </div>
</main>

<script type="module" src="js/reset.js"></script>
</body>
</html>
