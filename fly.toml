# fitnesskinda.fit — one machine, one volume, SQLite on disk.
#
# Secrets are NOT set here (this file is in a public repo). ADMIN_EMAILS is set
# with `fly secrets set`. See docs/deploy.md.

app = 'fitnesskinda'
primary_region = 'lhr'   # London: usually the lowest-latency Fly region from West Africa

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  DATA_DIR = '/data'
  PORT = '3000'
  ALLOWED_ORIGINS = 'https://fitnesskinda.fit'
  ACCESS_LOG = '1'          # method, route pattern and status only — never bodies

# The SQLite file lives here. Destroying this volume destroys the records.
[[mounts]]
  source = 'fk_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000
  force_https = true
  # The app is opened a handful of times a year, so let it sleep between visits.
  # First request after idle takes a second or two to wake.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
